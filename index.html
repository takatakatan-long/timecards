<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出勤簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #faf7f0;
    color: #26231d;
    font-family: 'Zen Maru Gothic', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    line-height: 1.8;
  }
  .card {
    width: 100%;
    max-width: 390px;
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(60, 48, 25, 0.07);
    overflow: hidden;
  }
  .band {
    background: linear-gradient(165deg, #377845 0%, #2a6038 100%);
    color: #ffffff;
    padding: 22px 22px 20px;
  }
  .band h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .band p {
    margin: 4px 0 0;
    font-size: 13px;
    color: #cfe3d1;
  }
  .body {
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .body p { margin: 0; font-size: 14px; }
  .note { color: #8a8172; font-size: 13px; }
  .ok {
    display: flex;
    align-items: center;
    gap: 9px;
    background: #eaf3ea;
    color: #2f6b3f;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="band">
      <h1>出勤簿</h1>
      <p>準備中</p>
    </div>
    <div class="body">
      <div class="ok">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"></path></svg>
        <span>公開できています</span>
      </div>
      <p>このページが表示されていれば、アプリを置く準備は整っています。</p>
      <p class="note">中身はこれから作ります。</p>
    </div>
  </div>
</body>
</html>
